<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Deal or No Deal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Deal or No Deal</h1>
  <div id="board"></div>
  <div id="info"></div>
  <button id="reset">Reset Game</button>
  <div id="main-case-area">
    <h3>Your Case</h3>
    <div id="main-case" class="main-case-container">
      <!-- main case goes here -->
    </div>
  </div>
  <div id="held-area">
    <h3>Comparison Cases</h3>
    <div id="held" class="held-container">
      <!-- comparison cases go here -->
    </div>
  </div>
  <div id="discard" class="discard-container">
    <!-- held tiles will go here -->
  </div>
  <script type="module" src="script.js"></script>
</body>
</html>
